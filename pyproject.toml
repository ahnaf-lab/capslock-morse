[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capslock-morse"
version = "0.1.0"
description = "Blink build/test/git results in Morse code on your keyboard LEDs"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["capslock_morse*"]
